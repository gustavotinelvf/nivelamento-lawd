<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prateleiras · REWIND</title>

    <link rel="stylesheet" href="css/variaveis.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/componentes.css" />
  </head>
  <body>
    <header class="topo">
      <a href="index.html" class="logo">REWIND</a>
      <button class="menu-botao" type="button" aria-label="Abrir menu">
        MENU
      </button>
      <nav class="menu" aria-label="Principal">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="catalogo.html" class="ativo">Prateleiras</a></li>
          <li><a href="sobre.html">Sobre</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="secao">
        <h1 class="secao-titulo">Prateleiras</h1>

        <!-- ========== BUSCA E FILTROS DE MOOD (ligados com JS na fase 3) ==========
           O data-mood de cada botão tem que bater com o data-mood das fitas. -->
        <div class="controles">
          <label for="busca">Buscar</label>
          <input
            type="search"
            id="busca"
            placeholder="Nome da faixa ou artista"
          />

          <div class="moods" id="moods">
            <button class="mo ativo" type="button" data-mood="todos">
              Todos
            </button>
            <button class="mo" type="button" data-mood="madrugada">
              Madrugada
            </button>
            <button class="mo" type="button" data-mood="sol">Dia de sol</button>
            <button class="mo" type="button" data-mood="melancolia">
              Melancolia
            </button>
            <button class="mo" type="button" data-mood="rock">
              Rock'n'roll
            </button>
          </div>
        </div>

        <!-- ========== FITAS ==========
           Na fase 2 essas fitas saem daqui e passam a ser geradas pelo JS
           a partir do array em js/dados.js. Por enquanto ficam fixas pra
           fechar o visual primeiro. -->
        <div class="grade-fitas" id="lista-fitas"></div>
      </section>
    </main>

    <footer class="rodape">
      <p>REWIND · Projeto de nivelamento · LAWD · UFS</p>
      <p>
        Capas e imagens usadas apenas para fins acadêmicos. Créditos aos
        respectivos autores.
      </p>
    </footer>
    <script src="js/dados.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
